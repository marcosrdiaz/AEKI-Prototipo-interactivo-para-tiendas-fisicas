<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="../style/mapa-mobile-style.css">
  <script src="/socket.io/socket.io.js"></script>
  <title>Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>
<body>
  <a id="boton-atras" class="back-button">←</a>
  <div class="header">
    <h1>Mapa</h1>
  </div>
  
  <div class="container">
    <!-- Catálogo de productos -->
    <div id="catalogo-container">
      <!-- Las imágenes de los productos se cargarán dinámicamente aquí -->
    </div>
    
    <!-- Mapa interactivo -->
    <div id="mapa"></div>

    <div id="producto-info-container">
      <h2 id="producto-nombre">Selecciona un producto</h2>
      <p id="producto-descripcion">Aquí aparecerá la información del producto seleccionado.</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="../scripts/mapa-mobile.js"></script>
</body>
</html>
