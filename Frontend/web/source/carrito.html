<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style/carrito-style.css">
  <script src="/socket.io/socket.io.js"></script>
  <title>Carrito</title>
</head>
<body>
  <div class="header">
    <!-- Instrucciones de navegación en la esquina superior izquierda -->
    <div class="instrucciones" style="display: none;">
      Agita para vaciar tu carrito
    </div>
    <a id="boton-atras" class="back-button">←</a>
    <h1>Carrito de Compras</h1>
  </div>
  <div id="carrito-container">
    <p>Cargando productos del carrito...</p>
  </div>
  <button id="vaciar-carrito" class="clear-cart">Vaciar Carrito</button>
  <div class="mode-indicator">
    Modo de entrada activo: <span id="modeLabel">GESTOS</span>
  </div>
  <script src="../scripts/carrito.js"></script>
</body>
</html>
